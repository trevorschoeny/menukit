// MenuKit: the UI library (panels, elements, layouts, HUD, regions, anchors).
// Universal since 6.0.0: src/main runs on both sides (placement types and the
// declarations freeze, which the Kits built on MenuKit use on servers too),
// src/client is what touches a screen, and Loom's split source sets make the
// compiler enforce that. MenuKit keeps no slot code (7.0.0): slots are SlotKit's,
// which depends on MenuKit, never the reverse.

plugins {
    // The Loom plugin id is namespaced from 1.15 on, and 1.17 is the line for
    // 26.2. The version is pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('menukit_version')
group   = 'com.trevlar'

base.archivesName = 'menukit'

// Stamps the real mod version into fabric.mod.json at build time. The manifest
// used to hardcode "1.0.0": bumping the Gradle version renamed the jar, but the
// loader reads fabric.mod.json and still saw 1.0.0, so every published jar
// reported 1.0.0 and no versioned dependency could ever be satisfied (Keybindery
// once failed to boot on it). fabric.mod.json declares "version": "${version}"
// and this block fills it from the project version, so the version lives in one
// place.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // YACL, for the YACL controller pressed-overlay mixin (compileOnly).
    // isxander's own Maven stops at the 3.8.x line; the 26.2 builds (3.9.x) are
    // only on this Maven repository.
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    // 26.x is unobfuscated: no mappings line, and mod dependencies use the
    // standard Java configurations (implementation instead of modImplementation,
    // and so on).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // @ApiStatus.Internal markers. Compile-only so consumers don't transitively
    // depend on jetbrains-annotations at runtime; the annotation is a doc/IDE
    // signal, never required at execution time.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // YACL, compile-only so MenuKitYaclControllerPressedMixin (a @Pseudo target)
    // can reference YACL classes. MenuKit does not depend on YACL at runtime: the
    // @Pseudo mixin is skipped silently when YACL is absent. YACL only reaches the
    // runtime through consumer mods that bundle it.
    compileOnly "maven.modrinth:yacl:3.9.7+26.3-fabric"
}

loom {
    // What touches a screen lives in src/client; src/main is what runs on both
    // sides. The compiler refuses a main class that reaches a client one.
    splitEnvironmentSourceSets()
    mods {
        menukit {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
    runs {
        client { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

jar {
    from('../LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// MenuKit retains the bare `menukit` Modrinth project ID per §0062.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "menukit"
    versionNumber = property('menukit_version')
    versionName = "MenuKit ${property('menukit_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history). Hardcoding it here went stale.
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('../README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact (remapJar is gone).
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
}

// The shipped jar must report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// MenuKit keeps no slot code (Amethyst, 7.0.0): the jar has no api/slot, api/window or
// window package, and no source or resource names slotkit (the library built on
// MenuKit), so the dependency stays one way. Prose may say "SlotKit"; code may not
// reach it.
tasks.register('verifyNoSlotCode') {
    dependsOn 'jar'
    def sources = fileTree('src') { exclude '**/*.png' }
    inputs.files(sources)
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def slotPackages = ['com/trevlar/menukit/api/slot/', 'com/trevlar/menukit/api/window/', 'com/trevlar/menukit/window/']
        def inJar = zipTree(jar).matching { slotPackages.each { p -> include "${p}**" } }.files
        def naming = sources.files.findAll { it.text.contains('slotkit') }
        def bad = inJar.collect { "jar: ${it.name}" } + naming.collect { "source names slotkit: ${projectDir.toPath().relativize(it.toPath())}" }
        if (bad) throw new GradleException("Slot code in MenuKit:\n  " + bad.join('\n  '))
        println "verifyNoSlotCode: ${jar.name} holds no slot package, and no source names slotkit"
    }
}
check.dependsOn verifyNoSlotCode

// No pre-release of MenuKit 7 on Modrinth, ever: every 6.x consumer's "<7.0.0"
// ceiling admits "7.0.0-beta.1" (semver puts it below 7.0.0), so a pre-release would
// load under mods built for 6.x and crash them on missing classes. A version with a
// pre-release part (a '-' before the '+') never uploads.
tasks.named('modrinth') {
    doFirst {
        def v = project.version.toString()
        if (v.split('\\+')[0].contains('-')) {
            throw new GradleException("MenuKit ${v} is a pre-release; MenuKit never publishes one to Modrinth.")
        }
    }
}

// Javadoc: the published API reference. Only the api packages; everything else
// is internal and stays out of the generated site.
// doclint keeps broken {@link}s as errors (a stale link is a doc bug);
// `missing` and `html` are off because getter @return tags and heading
// levels are noise, not defects.
javadoc {
    // The reference covers the api packages of both source sets.
    source += sourceSets.client.allJava
    classpath += sourceSets.client.compileClasspath + sourceSets.main.output + sourceSets.client.output
    include 'com/trevlar/menukit/api/**'
    options.addBooleanOption('Xdoclint:all,-missing,-html,-accessibility', true)
    options.tags = ['implNote:a:Implementation note:', 'implSpec:a:Implementation requirements:', 'apiNote:a:API note:']
    options.encoding = 'UTF-8'
    options.windowTitle = "${base.archivesName.get()} ${project.version}"
}
