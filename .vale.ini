# Prose lint for the public docs. Run: vale README.md docs/
StylesPath = .vale/styles
Vocab = MenuKit
MinAlertLevel = warning
Packages = Google, write-good, proselint

[*.md]
BasedOnStyles = Vale, Google, write-good, proselint, MenuKit
# Google rules that push toward a conversational tone; the docs are technical-only.
Google.Contractions = NO
Google.Colons = NO
Google.We = error
Google.Exclamation = error
# Code blocks and inline code are not prose.
BlockIgnores = (?s) *(```.*?```)
TokenIgnores = (`[^`]+`)
