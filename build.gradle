// ═══════════════════════════════════════════════════════════════════════════
// MenuKit — the UI library for Fabric mods. HUD panels, widgets, layouts,
// modal panels, region anchoring, click-through prohibition, recipe-book
// awareness — all client-only. Compile-time enforced as `environment: client`
// so consumer mods depending only on this artifact cannot accidentally
// reference server-coupled APIs (those live in :menukit-containers).
//
// Per §0042: this artifact retains the bare `menukit` mod ID. The slot
// extension (MenuKit: Containers) is published separately as menukit-containers.
//
// Produces menukit-1.0.0.jar — no dependency on any other subproject.
// ═══════════════════════════════════════════════════════════════════════════

plugins {
    // 26.x migration (2026-07-02): Loom plugin id is namespaced at 1.15+;
    // 1.17 is the 26.2-era line. Version pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('menukit_version')
group   = property('maven_group')

base.archivesName = 'menukit'

// Stamp the real mod version into fabric.mod.json at build time. The version
// used to be HARDCODED "1.0.0" in the manifest — bumping the gradle version
// property renamed the JAR but the loader (which reads fabric.mod.json) still
// saw 1.0.0, so every published artifact self-reported 1.0.0 and no versioned
// dependency gate could ever be satisfied (the 2026-07-01 Keybindery boot
// wall). fabric.mod.json now declares "version": "${version}" and this block
// expands it from the project version — one source of truth.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // YACL — for the YACL-controller pressed-overlay mixin (compileOnly).
    // 26.x: isxander's own maven stops at the 3.8.x line; the 26.2 builds
    // (3.9.x) ship via the Modrinth maven only (verified 2026-07-02).
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    // 26.x: the game is unobfuscated — no mappings line, and mod deps use the
    // standard java configurations (modImplementation → implementation etc.).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // @ApiStatus.Internal markers. Compile-only so consumers don't transitively
    // depend on jetbrains-annotations at runtime; the annotation is a doc/IDE
    // signal, never required at execution time.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // YACL — compile-only so MK can reference YACL classes in
    // MenuKitYaclControllerPressedMixin (@Pseudo target). MK does NOT
    // depend on YACL at runtime — the mixin uses @Pseudo to be
    // tolerant of YACL absence (silently skips). YACL only enters the
    // runtime environment via consumer mods that bundle it per §0031.
    compileOnly "maven.modrinth:yacl:3.9.6+26.2-fabric"
}

loom {
    runs {
        client { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

jar {
    from('LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// MenuKit retains the bare `menukit` Modrinth project ID per §0042.
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "menukit"
    versionNumber = property('menukit_version')
    versionName = "MenuKit ${property('menukit_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history). Hardcoding it here went stale.
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('README.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact (remapJar is gone).
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
    }
}

// ci-cd.md stage 2: the shipped jar must self-report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion
