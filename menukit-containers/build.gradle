// ═══════════════════════════════════════════════════════════════════════════
// MenuKit: Containers — the slot extension for MenuKit. Adds custom container
// menus (MenuKitScreenHandler), per-slot state (M1), slot-group regions,
// custom payloads, server-coupled mixins, and the contract verification
// harness. Universal (`environment: "*"`) — both client and server
// participate in slot state and verification.
//
// The story per §0042: MenuKit is the UI library; MenuKit: Containers adds
// slots to MenuKit. Consumer mods that build custom container menus depend
// on this artifact; consumer mods that only need HUD/widgets/layouts depend
// on `:menukit` alone.
//
// Produces menukit-containers-1.0.0.jar — depends on :menukit (one-way per
// §0042).
// ═══════════════════════════════════════════════════════════════════════════

plugins {
    // 26.x migration (2026-07-02): Loom plugin id is namespaced at 1.15+;
    // 1.17 is the 26.2-era line. Version pinned at the workspace root.
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'java-library'
    id 'com.modrinth.minotaur' version '2.+'
}

version = property('menukit_version')
group   = 'com.trevlar'

base.archivesName = 'menukit-containers'

// Stamp the real mod version into fabric.mod.json at build time. The version
// used to be HARDCODED "1.0.0" in the manifest — bumping the gradle version
// property renamed the JAR but the loader (which reads fabric.mod.json) still
// saw 1.0.0, so every published artifact self-reported 1.0.0 and no versioned
// dependency gate could ever be satisfied (the 2026-07-01 Keybindery boot
// wall). fabric.mod.json now declares "version": "${version}" and this block
// expands it from the project version — one source of truth.
processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // Minecraft 26.x runs on Java 25.
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    // §0052 Phase 2 — optional grave-mod adapters (modCompileOnly below):
    maven { url 'https://api.modrinth.com/maven' }   // Universal Graves, Pneumono's Gravestones
    maven { url 'https://maven.nucleoid.xyz' }        // UG's transitive deps (xyz.nucleoid / Polymer)
}

dependencies {
    // 26.x: the game is unobfuscated — no mappings line, and mod deps use the
    // standard java configurations (modImplementation → implementation etc.).
    minecraft "com.mojang:minecraft:${property('minecraft_version')}"
    implementation "net.fabricmc:fabric-loader:${property('loader_version')}"
    implementation "net.fabricmc.fabric-api:fabric-api:${property('fabric_version')}"

    // §0042 one-way dependency: MenuKit: Containers depends on MenuKit.
    // MenuKit does NOT depend on this artifact (enforced at gradle level).
    // Uses `api` (not `implementation`) so consumers depending on
    // :menukit-containers get :menukit transitively at compile time —
    // validator and future consumer mods need access to both surfaces
    // through a single project dependency. Requires the `java-library`
    // plugin (above) to expose the `api` configuration.
    // (26.x: the remap layer is gone, so the `namedElements` variant no
    // longer exists — a plain project dep is THE artifact now.)
    api project(':menukit')

    // @ApiStatus.Internal markers. Compile-only so consumers don't transitively
    // depend on jetbrains-annotations at runtime; the annotation is a doc/IDE
    // signal, never required at execution time.
    compileOnly 'org.jetbrains:annotations:24.1.0'

    // §0052 Phase 2 — grave-mod compat adapters. OPTIONAL dependencies: compile
    // against the grave mods' capture APIs, but MKC hard-depends on NEITHER —
    // each adapter class is loaded only behind a FabricLoader isModLoaded(...)
    // guard, and falls back to the Phase-1 floor when the mod is absent.
    // 26.x: bumped to UG's 26.2 release (3.12.0+26.2, verified on Modrinth
    // 2026-07-02) — the old 1.21.11 jar is intermediary-mapped and can't be
    // compiled against in the no-remap world.
    compileOnly "maven.modrinth:universal-graves:3.12.0+26.2"
    // Pneumono's Gravestones — DEFERRED (floored). Was blocked on a Loom
    // version wall (its jar was built with a newer Loom than the workspace's
    // 1.14). The workspace is now on Loom 1.17, but re-enabling the adapter
    // needs a 26.2 Pneumono build + adapter re-verification — a design/compat
    // decision for the owning unit, not this behavior-preserving pass.
    // compileOnly "maven.modrinth:pneumono_gravestones:1.4.1+1.21.11+A"
}

loom {
    runs {
        client { ideConfigGenerated = false }
        // Test Gallery: boots straight into the generated test world in run/saves/TestGallery.
        // Generate it with `test-gallery/run-scene.sh <mod> <scene>` (which also runs this).
        testGallery {
            inherit client
            name 'Test Gallery'
            programArgs '--quickPlaySingleplayer', 'TestGallery'
            ideConfigGenerated = false
        }
        server { ideConfigGenerated = false }
    }
}

jar {
    from('../LICENSE') { rename { "${it}_${project.name}" } }
}

// ── Modrinth Publishing ────────────────────────────────────────────────
// MKC Modrinth project created Phase 17 (2026-05-15); project ID xQUBXV8I.
// Declares MenuKit as a required dependency per §0042 (MKC depends on MK).
modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = "xQUBXV8I"
    versionNumber = property('menukit_version')
    versionName = "MenuKit: Containers ${property('menukit_version')}"
    versionType = "release"
    // ci-cd.md stage 5: the player-facing changelog lives in changelog.md, one entry,
    // overwritten each release (git keeps the history). Hardcoding it here went stale.
    changelog = file('changelog.md').text
    // ci-cd.md stage 7: the README is the public description; `modrinthSyncBody` pushes it.
    syncBodyFrom = file('MODRINTH.md').text
    // 26.x: no remap step — `jar` IS the shippable artifact (remapJar is gone).
    uploadFile = jar
    gameVersions = [property('minecraft_version')]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.project "menukit"
    }
}

// ci-cd.md stage 2: the shipped jar must self-report the bumped version. A jar that
// says the wrong version silently breaks every dependency gate against it, so this
// fails the build instead of relying on someone remembering to unzip and look.
tasks.register('verifyJarVersion') {
    dependsOn 'jar'
    doLast {
        def jar = tasks.named('jar').get().archiveFile.get().asFile
        def modJson = zipTree(jar).matching { include 'fabric.mod.json' }.singleFile
        def stamped = new groovy.json.JsonSlurper().parse(modJson).version
        if (stamped != project.version.toString()) {
            throw new GradleException("${jar.name}: fabric.mod.json says ${stamped}, expected ${project.version}")
        }
        println "verifyJarVersion: ${jar.name} reports ${stamped}"
    }
}
build.dependsOn verifyJarVersion

// ── Javadoc: the published API reference ────────────────────────────────
// Consumer-facing reference only. Mixins, network payloads, and state
// plumbing are implementation and stay out of the generated site.
// doclint keeps broken {@link}s as errors (a stale link is a doc bug);
// `missing` and `html` are off because getter @return tags and heading
// levels are noise, not defects.
javadoc {
    // One reference for both artifacts: this task also takes the :menukit sources,
    // so links from MenuKit types to Containers types resolve. Published to Pages.
    source += project(':menukit').sourceSets.main.allJava
    classpath += project(':menukit').sourceSets.main.compileClasspath
    exclude 'com/trevlar/menukit/mixin/**'
    exclude 'com/trevlar/menukit/network/**'
    exclude 'com/trevlar/menukit/state/**'
    options.addBooleanOption('Xdoclint:all,-missing,-html,-accessibility', true)
    options.tags = ['implNote:a:Implementation note:', 'implSpec:a:Implementation requirements:', 'apiNote:a:API note:']
    options.encoding = 'UTF-8'
    options.windowTitle = "MenuKit ${project.version}"
}
